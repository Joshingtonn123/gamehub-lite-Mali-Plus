name: Build Gamehub Mali+ APKs (All Variants)

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  SOURCE_APK_URL: https://github.com/Producdevity/gamehub-lite/releases/download/v5.1.0-patch/GameHub-5.1.0.apk
  SOURCE_APK_MD5: 42db81116bf3c74e52e6f6afb4ec9f91
  APKTOOL_VERSION: "2.12.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK Environment
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          # Add latest build-tools and platform-tools to PATH
          if [ -d "$ANDROID_HOME/build-tools" ]; then
            LATEST_BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
            echo "Found Android build tools: $LATEST_BUILD_TOOLS"
            echo "$LATEST_BUILD_TOOLS" >> "$GITHUB_PATH"
          fi
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          fi

          # Accept SDK licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

          # Ensure platform android-34 is present, or download it
          if [ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
            echo "Installing android-34 platform..."
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null 2>&1 || true
          fi

      - name: Install apktool
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tools" /usr/local/bin
          curl -sSL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o "$GITHUB_WORKSPACE/tools/apktool_${APKTOOL_VERSION}.jar"
          cp "$GITHUB_WORKSPACE/tools/apktool_${APKTOOL_VERSION}.jar" /usr/local/bin/apktool.jar

          cat > /usr/local/bin/apktool << 'WRAPPER'
          #!/bin/bash
          exec java -jar /usr/local/bin/apktool.jar "$@"
          WRAPPER
          chmod +x /usr/local/bin/apktool

          echo "APKTOOL_JAR=$GITHUB_WORKSPACE/tools/apktool_${APKTOOL_VERSION}.jar" >> "$GITHUB_ENV"
          echo "Installed apktool version: $(apktool --version)"

      - name: Download source APK
        run: |
          mkdir -p apk
          curl -sSL "$SOURCE_APK_URL" -o apk/GameHub-5.1.0.apk || wget -q "$SOURCE_APK_URL" -O apk/GameHub-5.1.0.apk

          md5=$(md5sum apk/GameHub-5.1.0.apk | awk '{print $1}')
          if [ "$md5" != "$SOURCE_APK_MD5" ]; then
            echo "::error::MD5 mismatch: expected $SOURCE_APK_MD5, got $md5"
            exit 1
          fi
          echo "Source APK MD5 verified: $md5"

      - name: Compile Java extension to classes.dex
        if: hashFiles('extension/*.java') != ''
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using android.jar: $ANDROID_JAR"

          mkdir -p ext_classes ext_dex
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d ext_classes extension/*.java

          D8_TOOL=$(which d8 || find "$ANDROID_HOME/build-tools" -name "d8" 2>/dev/null | sort -V | tail -1)
          echo "Using d8 tool: $D8_TOOL"
          "$D8_TOOL" --release --output ext_dex $(find ext_classes -name '*.class')

          ls -la ext_dex/classes.dex
          echo "EXTENSION_DEX_PATH=$GITHUB_WORKSPACE/ext_dex/classes.dex" >> "$GITHUB_ENV"

      - name: Build Gamehub Mali+ APKs (All Variants)
        run: |
          chmod +x *.sh || true
          RELEASE=true bash ./patch.sh
          # Ensure base APK is accessible as both versioned and unversioned
          if [ -f "output/Gamehub-Mali-Plus-v1.0-Alpha.apk" ] && [ ! -f "output/Gamehub-Mali-Plus.apk" ]; then
            cp -f output/Gamehub-Mali-Plus-v1.0-Alpha.apk output/Gamehub-Mali-Plus.apk
          fi

      - name: List Generated APK Variants
        run: |
          echo "Generated APK files:"
          ls -lah output/

      - name: Upload Gamehub Mali+ APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gamehub-Mali-Plus-APKs
          path: output/*.apk
          retention-days: 30
          if-no-files-found: error
