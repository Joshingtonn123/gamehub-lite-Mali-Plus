name: Build Gamehub Mali+ Release APKs

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:

env:
  SOURCE_APK_URL: https://github.com/Producdevity/gamehub-lite/releases/download/v5.1.0-patch/GameHub-5.1.0.apk
  SOURCE_APK_MD5: 42db81116bf3c74e52e6f6afb4ec9f91
  APKTOOL_VERSION: "2.12.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install apktool
        run: |
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -O /usr/local/bin/apktool.jar
          cat > /usr/local/bin/apktool << 'WRAPPER'
          #!/bin/bash
          exec java -jar /usr/local/bin/apktool.jar "$@"
          WRAPPER
          chmod +x /usr/local/bin/apktool

      - name: Download source APK
        run: |
          mkdir -p apk
          wget -q "$SOURCE_APK_URL" -O apk/GameHub-5.1.0.apk

          md5=$(md5sum apk/GameHub-5.1.0.apk | awk '{print $1}')
          if [ "$md5" != "$SOURCE_APK_MD5" ]; then
            echo "::error::MD5 mismatch: expected $SOURCE_APK_MD5, got $md5"
            exit 1
          fi
          echo "MD5 verified: $md5"

      - name: Set up Android SDK
        if: hashFiles('extension/*.java') != ''
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          packages: 'build-tools;34.0.0'

      - name: Compile Java extension to classes.dex
        if: hashFiles('extension/*.java') != ''
        run: |
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            sdkmanager "platforms;android-34"
          fi

          mkdir -p ext_classes ext_dex
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d ext_classes extension/*.java

          BUILD_TOOLS=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/d8" \
            --release \
            --output ext_dex \
            $(find ext_classes -name '*.class')

          ls -la ext_dex/classes.dex
          echo "EXTENSION_DEX_PATH=$GITHUB_WORKSPACE/ext_dex/classes.dex" >> "$GITHUB_ENV"

      - name: Build Gamehub Mali+ APKs (All Variants)
        run: |
          RELEASE=true ./patch.sh
          cp output/Gamehub-Mali-Plus-v1.0-Alpha.apk output/Gamehub-Mali-Plus.apk

      - name: List Generated APK Variants
        run: |
          ls -lah output/

      - name: Upload Gamehub Mali+ APK Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Gamehub-Mali-Plus-1.0-Alpha-Variants
          path: output/*.apk
          retention-days: 30
